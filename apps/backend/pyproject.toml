[project]
name = "life-helper-backend"
version = "0.1.0"
description = "Open-source workbench for small business owners"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn>=0.30,<1",
  "Pillow==13.0.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "SQLAlchemy==2.0.55",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/life_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
